name: Build Windows App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: familyschool-desktop

      - name: Build Windows app
        run: npm run build
        working-directory: familyschool-desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: FamilySchool-Windows
          path: familyschool-desktop/dist/*.exe
